# Cli defaults. Extra keys are built into the app (ESC, S-TAB, TAB, CTRL, ALT, - / |, ^C ^D ^L, arrows).
use-black-ui = true
terminal-transcript-rows = 3000
terminal-cursor-style = bar
terminal-cursor-blink-rate = 0
bell-character = ignore
back-key = escape
terminal-margin-horizontal = 6
terminal-margin-vertical = 2
