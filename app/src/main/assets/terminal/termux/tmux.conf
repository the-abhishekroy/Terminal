set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
# mouse OFF so a tap on the screen opens the Android keyboard (Ctrl-b m toggles it)
set -g mouse off
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"
set -g history-limit 20000
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
# status bar hidden by default (saves a row on a phone). Ctrl-b b shows/hides it.
set -g status off
bind b set -g status
set -g status-position bottom
set -g status-interval 30
set -g status-style "bg=#1a1b26,fg=#7aa2f7"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M"
set -g window-status-current-style "fg=#bb9af7,bold"
